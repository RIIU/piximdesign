<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lottie Two-Tone Brand Preview</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    body { background: #0B0F17; color: white; font-family: system-ui, sans-serif; padding: 40px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1000px; margin: 0 auto; }
    .card { background: rgba(17, 24, 39, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 24px; text-align: center; }
    .anim { width: 96px; height: 96px; margin: 0 auto 16px; }
    h3 { font-size: 16px; margin: 0 0 8px; color: #FFA133; }
    p { font-size: 12px; color: #94A3B8; margin: 0; }
  </style>
</head>
<body>
  <h1 style="text-align: center; margin-bottom: 8px;">Pixim Design - 2 Brand Colors Preview</h1>
  <p style="text-align: center; margin-bottom: 32px; color: #94A3B8;">Primary: <span style="color: #FF8500; font-weight: bold;">#FF8500</span> | Secondary: <span style="color: #2651B9; font-weight: bold;">#2651B9</span></p>
  <div class="grid">

    <div class="card">
      <div id="anim-branding" class="anim"></div>
      <h3>branding</h3>
    </div>
  
    <div class="card">
      <div id="anim-website-design" class="anim"></div>
      <h3>website-design</h3>
    </div>
  
    <div class="card">
      <div id="anim-mobile-app" class="anim"></div>
      <h3>mobile-app</h3>
    </div>
  
    <div class="card">
      <div id="anim-dashboard-design" class="anim"></div>
      <h3>dashboard-design</h3>
    </div>
  
    <div class="card">
      <div id="anim-saas-design" class="anim"></div>
      <h3>saas-design</h3>
    </div>
  
    <div class="card">
      <div id="anim-web-app" class="anim"></div>
      <h3>web-app</h3>
    </div>
  
  </div>
  <script>
    const files = ["branding.json","website-design.json","mobile-app.json","dashboard-design.json","saas-design.json","web-app.json"];
    files.forEach(f => {
      const name = f.replace('.json', '');
      lottie.loadAnimation({
        container: document.getElementById('anim-' + name),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: '/lottie/' + f
      });
    });
  </script>
</body>
</html>
